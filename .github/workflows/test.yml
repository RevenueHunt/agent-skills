name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Check required media capabilities
        run: |
          ffmpeg -hide_banner -encoders 2>/dev/null | grep libx264
          ffmpeg -hide_banner -encoders 2>/dev/null | grep aac
          ffmpeg -hide_banner -filters 2>/dev/null | grep subtitles
      - name: Unit and media tests (no model download)
        run: python -m unittest discover -s skills/narrated-demo/tests -v
